<!DOCTYPE html>
<html lang="uk" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Doc Manhattan AI v6.0 - Universal Quantum Model</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        doc: {
                            bg: '#030712',
                            card: '#0b132b',
                            panel: '#101d42',
                            cyan: '#00f0ff',
                            blue: '#00a8ff',
                            darkBorder: '#1c315e',
                            glow: 'rgba(0, 240, 255, 0.4)'
                        }
                    },
                    boxShadow: {
                        'manhattan': '0 0 20px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1)',
                        'glow-lg': '0 0 35px rgba(0, 240, 255, 0.4)',
                        'pulse-cyan': '0 0 15px #00f0ff'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #030712;
            color: #e0f2fe;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1c315e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        /* Hydrogen Atom Symbol */
        .hydrogen-atom {
            width: 34px;
            height: 34px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px #00f0ff;
            flex-shrink: 0;
        }
        .hydrogen-atom::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f0ff;
        }
        .hydrogen-atom::after {
            content: '';
            position: absolute;
            top: 2px;
            width: 5px;
            height: 5px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f0ff;
        }

        /* Markdown Styling */
        .prose pre {
            background-color: #050b14 !important;
            border: 1px solid #1c315e;
            border-radius: 0.75rem;
            padding: 0.85rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            overflow-x: auto;
            position: relative;
        }
        .prose p {
            margin-bottom: 0.6rem;
            line-height: 1.55;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
        .prose strong {
            color: #38bdf8;
        }
        .prose ul, .prose ol {
            padding-left: 1.2rem;
            margin-bottom: 0.6rem;
        }

        .mic-active {
            animation: pulse-red 1.2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Safe area spacing for mobile browsers / PWA */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col md:flex-row bg-doc-bg text-cyan-50 select-none">

    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 hidden md:hidden transition-opacity duration-300"></div>

    <aside id="sidebar-drawer" class="fixed md:static inset-y-0 left-0 w-80 max-w-[85vw] bg-doc-card border-r border-doc-darkBorder flex flex-col justify-between p-4 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0 h-full overflow-y-auto">
        <div class="flex flex-col h-full">
            <!-- Header Logo & Close Mobile Button -->
            <div class="flex items-center justify-between p-1 mb-3 border-b border-doc-darkBorder/80 pb-3">
                <div class="flex items-center gap-3">
                    <div class="hydrogen-atom animate-pulse"></div>
                    <div>
                        <h1 class="font-black text-base text-cyan-300 tracking-wider leading-none">DOC MANHATTAN</h1>
                        <p class="text-[10px] text-cyan-400 font-mono mt-1">QUANTUM MODEL v6.0</p>
                    </div>
                </div>
                <button id="close-drawer-btn" class="md:hidden text-gray-400 hover:text-cyan-300 p-2 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- New Chat Button -->
            <button id="new-chat-btn" class="w-full mb-3 py-3 px-4 bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-slate-950 font-bold rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-manhattan touch-manipulation">
                <i class="fa-solid fa-plus text-sm"></i> <span id="ui-new-chat-text">Новий діалог</span>
            </button>

            <div class="mb-3 p-3 bg-doc-panel/80 rounded-xl border border-doc-darkBorder">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] font-mono text-cyan-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-shield-halved text-cyan-400"></i> <span id="ui-auth-status-title">Профіль / Акаунт</span>
                    </span>
                    <button id="auth-modal-trigger" class="text-[11px] text-cyan-400 hover:text-white transition font-mono bg-slate-950 px-2 py-0.5 rounded border border-doc-darkBorder">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i> <span id="auth-btn-label">Вхід</span>
                    </button>
                </div>
                <div id="user-display-name" class="text-xs font-bold text-white font-mono bg-slate-950 px-2.5 py-1.5 rounded border border-blue-900/60 truncate flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block"></span>
                    <span id="user-display-text">Гість</span>
                </div>
            </div>

            <div class="mb-3 p-2.5 bg-slate-950/80 rounded-xl border border-doc-darkBorder space-y-2">
                <div>
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">
                        <i class="fa-solid fa-language mr-1"></i> <span id="ui-lang-label">Мова розмови:</span>
                    </label>
                    <select id="lang-select" class="w-full bg-slate-900 border border-doc-darkBorder text-xs text-cyan-100 rounded-lg p-2 focus:outline-none focus:border-cyan-400">
                        <option value="uk">🇺🇦 Українська</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="pl">🇵🇱 Polski</option>
                        <option value="fr">🇫🇷 Français</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">
                        <i class="fa-solid fa-microchip mr-1"></i> <span id="ui-spec-label">Спеціалізація AI:</span>
                    </label>
                    <select id="mode-select" class="w-full bg-slate-900 border border-doc-darkBorder text-xs text-cyan-100 rounded-lg p-2 focus:outline-none focus:border-cyan-400">
                        <option value="general">🌐 Універсальний Інтелект</option>
                        <option value="business">📈 Бізнес & Стратегія</option>
                        <option value="it">💻 IT & Архітектура Коду</option>
                        <option value="science">🔬 Фундаментальні Науки</option>
                        <option value="mentor">🧠 Менторство 24/7</option>
                        <option value="express">⚡ Експрес-Відповідь</option>
                    </select>
                </div>
            </div>

            <!-- Saved Chats List -->
            <div class="flex-1 min-h-[140px] flex flex-col mb-3">
                <div class="text-[11px] font-mono text-cyan-400 mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-comments mr-1"></i> <span id="ui-chats-label">Збережені діалоги</span></span>
                    <span id="chat-count" class="text-[9px] bg-slate-950 px-1.5 py-0.5 rounded text-gray-400">0</span>
                </div>
                <div id="chats-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-48 md:max-h-none">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div class="p-3 bg-slate-950/80 border border-doc-darkBorder rounded-xl mb-3 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-cyan-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-globe text-cyan-400"></i> Пошук Google
                    </span>
                    <input type="checkbox" id="search-grounding" checked class="w-4 h-4 rounded bg-slate-900 border-doc-darkBorder text-cyan-400 focus:ring-0 cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-cyan-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-volume-high text-cyan-400"></i> Озвучення ответов
                    </span>
                    <input type="checkbox" id="tts-toggle" class="w-4 h-4 rounded bg-slate-900 border-doc-darkBorder text-cyan-400 focus:ring-0 cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-cyan-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-key text-cyan-400"></i> API Ключ
                    </span>
                    <button id="open-api-modal" class="text-[10px] text-cyan-300 underline hover:text-white">Налаштувати</button>
                </div>
            </div>
        </div>

        <!-- Network Status -->
        <div class="pt-2 border-t border-doc-darkBorder/60 flex justify-between items-center text-[10px] text-gray-400 font-mono">
            <span>СИСТЕМА: <strong class="text-cyan-400">v6.0 MAX</strong></span>
            <span id="network-status" class="text-emerald-400"><i class="fa-solid fa-signal mr-1"></i> Онлайн</span>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-doc-bg relative overflow-hidden min-w-0">
        <!-- Main Top Bar Header -->
        <header class="p-3 border-b border-doc-darkBorder bg-doc-card/80 backdrop-blur flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <button id="open-drawer-btn" class="md:hidden p-2 text-cyan-400 hover:text-white rounded-lg bg-slate-950 border border-doc-darkBorder">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping shrink-0"></span>
                <span id="current-chat-title" class="text-xs md:text-sm font-mono text-cyan-300 font-semibold tracking-wide truncate">
                    Новий діалог
                </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="export-chat-btn" title="Експорт" class="text-[11px] text-gray-300 hover:text-cyan-300 transition font-mono flex items-center gap-1 p-2 md:px-2.5 md:py-1 bg-slate-950 border border-doc-darkBorder rounded-lg">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Експорт</span>
                </button>
                <button id="clear-chat-btn" title="Очистити" class="text-[11px] text-gray-300 hover:text-red-400 transition font-mono flex items-center gap-1 p-2 md:px-2.5 md:py-1 bg-slate-950 border border-doc-darkBorder rounded-lg">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Очистити</span>
                </button>
            </div>
        </header>

        <!-- Message History Feed -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-3 md:p-6 space-y-4 z-10">
            <!-- Dynamic Messages inserted here -->
        </div>

        <div id="file-preview-bar" class="hidden px-4 py-2 bg-slate-950 border-t border-doc-darkBorder z-10 flex items-center justify-between text-xs text-cyan-300 font-mono">
            <div class="flex items-center gap-2 truncate">
                <i class="fa-solid fa-paperclip text-cyan-400"></i>
                <span id="file-preview-name" class="truncate"></span>
            </div>
            <button id="remove-file-btn" class="text-gray-400 hover:text-red-400 p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Computation Thinking Indicator -->
        <div id="loading-indicator" class="hidden px-4 md:px-6 py-2 z-10">
            <div class="flex items-center gap-3 text-cyan-400 font-mono text-xs bg-slate-950/90 py-2 px-4 rounded-xl border border-doc-darkBorder w-fit shadow-manhattan">
                <i class="fa-solid fa-atom fa-spin text-sm text-cyan-300"></i>
                <span>Doctor Manhattan AI аналізує квантову структуру...</span>
            </div>
        </div>

        <footer class="p-2 md:p-4 border-t border-doc-darkBorder bg-doc-card/90 backdrop-blur z-10 shrink-0 pb-safe">
            <form id="chat-form" class="max-w-4xl mx-auto flex gap-1.5 md:gap-2 items-end">
                <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.js,.py,.html,.css,.json,.md">
                
                <button type="button" id="attach-btn" title="Додати файл" 
                        class="p-3 bg-slate-950 hover:bg-slate-900 active:scale-95 border border-doc-darkBorder text-cyan-400 rounded-xl transition flex items-center justify-center shrink-0 touch-manipulation">
                    <i class="fa-solid fa-paperclip text-base"></i>
                </button>

                <button type="button" id="mic-btn" title="Голосове введення" 
                        class="p-3 bg-slate-950 hover:bg-slate-900 active:scale-95 border border-doc-darkBorder text-cyan-400 rounded-xl transition flex items-center justify-center shrink-0 touch-manipulation">
                    <i class="fa-solid fa-microphone text-base" id="mic-icon"></i>
                </button>

                <textarea id="user-input" rows="1" placeholder="Задайте питання, надішліть код..." 
                          class="flex-1 bg-slate-950 border border-doc-darkBorder rounded-xl p-3 text-sm text-cyan-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 resize-none max-h-36 shadow-inner"></textarea>
                
                <button type="submit" id="send-btn" 
                        class="bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-slate-950 font-bold p-3 px-4 md:px-5 rounded-xl border border-cyan-300 shadow-manhattan transition duration-200 flex items-center justify-center shrink-0 touch-manipulation">
                    <i class="fa-solid fa-paper-plane text-base"></i>
                </button>
            </form>
        </footer>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-doc-card border border-doc-darkBorder rounded-2xl p-6 max-w-sm w-full shadow-glow-lg text-cyan-100 relative">
            <button id="close-auth-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-4">
                <div class="hydrogen-atom"></div>
                <div>
                    <h2 class="text-sm font-bold text-cyan-300 font-mono">АВТОРИЗАЦІЯ</h2>
                    <p class="text-[10px] text-gray-400">Увійдіть для синхронізації</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-doc-darkBorder mb-4 text-xs font-mono">
                <button id="tab-login-btn" class="flex-1 pb-2 border-b-2 border-cyan-400 text-cyan-300 font-bold">Вхід</button>
                <button id="tab-register-btn" class="flex-1 pb-2 border-b-2 border-transparent text-gray-400">Реєстрація</button>
            </div>

            <!-- Login / Register Form -->
            <form id="auth-form" class="space-y-3">
                <div id="name-field-group" class="hidden">
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">Ім'я користувача</label>
                    <input type="text" id="auth-name-input" placeholder="Олександр" class="w-full bg-slate-950 border border-doc-darkBorder rounded-xl p-2.5 text-xs text-cyan-100 focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">Email пошта</label>
                    <input type="email" id="auth-email-input" required placeholder="user@quantum.ai" class="w-full bg-slate-950 border border-doc-darkBorder rounded-xl p-2.5 text-xs text-cyan-100 focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">Пароль</label>
                    <input type="password" id="auth-password-input" required placeholder="••••••••" class="w-full bg-slate-950 border border-doc-darkBorder rounded-xl p-2.5 text-xs text-cyan-100 focus:outline-none focus:border-cyan-400">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-manhattan mt-2">
                    Увійти в акаунт
                </button>
            </form>

            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-doc-darkBorder"></div></div
