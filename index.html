<!DOCTYPE html>
<html lang="uk" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>Doc Manhattan AI</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown Processing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        doc: {
                            bg: '#030712',
                            card: '#0b132b',
                            panel: '#101d42',
                            cyan: '#00f0ff',
                            darkBorder: '#1c315e'
                        }
                    },
                    boxShadow: {
                        'manhattan': '0 0 20px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1)',
                        'glow-lg': '0 0 35px rgba(0, 240, 255, 0.4)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #030712;
            color: #e0f2fe;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1c315e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }

        .hydrogen-atom {
            width: 32px;
            height: 32px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px #00f0ff;
            flex-shrink: 0;
        }
        .hydrogen-atom::before {
            content: '';
            width: 7px;
            height: 7px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f0ff;
        }

        .prose pre {
            background-color: #050b14 !important;
            border: 1px solid #1c315e;
            border-radius: 0.75rem;
            padding: 0.85rem;
            margin: 0.5rem 0;
            overflow-x: auto;
            position: relative;
        }
        .prose p { margin-bottom: 0.6rem; line-height: 1.55; }
        .prose p:last-child { margin-bottom: 0; }
        .prose strong { color: #38bdf8; }
        .prose ul, .prose ol { padding-left: 1.2rem; margin-bottom: 0.6rem; }

        .mic-active { animation: pulse-red 1.2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
    </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col md:flex-row bg-doc-bg text-cyan-50 select-none">

    <!-- Mobile Drawer Overlay Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar-drawer" class="fixed md:static inset-y-0 left-0 w-80 max-w-[85vw] bg-doc-card border-r border-doc-darkBorder flex flex-col justify-between p-4 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0 h-full overflow-y-auto">
        <div class="flex flex-col h-full">
            <!-- Header Logo -->
            <div class="flex items-center justify-between p-1 mb-3 border-b border-doc-darkBorder/80 pb-3">
                <div class="flex items-center gap-3">
                    <div class="hydrogen-atom animate-pulse"></div>
                    <div>
                        <h1 class="font-black text-base text-cyan-300 tracking-wider leading-none">DOC MANHATTAN</h1>
                        <p class="text-[10px] text-cyan-400 font-mono mt-1">QUANTUM MODEL v6.0</p>
                    </div>
                </div>
                <button id="close-drawer-btn" class="md:hidden text-gray-400 hover:text-cyan-300 p-2 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- New Dialogue Button -->
            <button id="new-chat-btn" class="w-full mb-3 py-3 px-4 bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-slate-950 font-bold rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-manhattan touch-manipulation">
                <i class="fa-solid fa-plus text-sm"></i> <span>Новий діалог</span>
            </button>

            <!-- Profile Info -->
            <div class="mb-3 p-3 bg-doc-panel/80 rounded-xl border border-doc-darkBorder">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] font-mono text-cyan-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-user-gear text-cyan-400"></i> <span>Користувач</span>
                    </span>
                    <button id="edit-user-btn" class="text-[10px] text-cyan-400 hover:text-white font-mono bg-slate-950 px-2 py-0.5 rounded border border-doc-darkBorder">Змінити ім'я</button>
                </div>
                <div id="user-display-name" class="text-xs font-bold text-white font-mono bg-slate-950 px-2.5 py-1.5 rounded border border-blue-900/60 truncate flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block"></span>
                    <span id="user-display-text">Гість</span>
                </div>
            </div>

            <!-- Language & Mode Selectors -->
            <div class="mb-3 p-2.5 bg-slate-950/80 rounded-xl border border-doc-darkBorder space-y-2">
                <div>
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">
                        <i class="fa-solid fa-language mr-1"></i> Мова діалогу:
                    </label>
                    <select id="lang-select" class="w-full bg-slate-900 border border-doc-darkBorder text-xs text-cyan-100 rounded-lg p-2 focus:outline-none">
                        <option value="uk">🇺🇦 Українська</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="pl">🇵🇱 Polski</option>
                        <option value="fr">🇫🇷 Français</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-mono text-cyan-400 block mb-1">
                        <i class="fa-solid fa-microchip mr-1"></i> Спеціалізація AI:
                    </label>
                    <select id="mode-select" class="w-full bg-slate-900 border border-doc-darkBorder text-xs text-cyan-100 rounded-lg p-2 focus:outline-none">
                        <option value="general">🌐 Універсальний Інтелект</option>
                        <option value="business">📈 Бізнес & Стратегія</option>
                        <option value="it">💻 IT & Архітектура Коду</option>
                        <option value="science">🔬 Фундаментальні Науки</option>
                        <option value="mentor">🧠 Менторство 24/7</option>
                    </select>
                </div>
            </div>

            <!-- Saved Dialogues -->
            <div class="flex-1 min-h-[140px] flex flex-col mb-3">
                <div class="text-[11px] font-mono text-cyan-400 mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-comments mr-1"></i> Збережені діалоги</span>
                    <span id="chat-count" class="text-[9px] bg-slate-950 px-1.5 py-0.5 rounded text-gray-400">0</span>
                </div>
                <div id="chats-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-48 md:max-h-none">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- Toggles Section -->
            <div class="p-3 bg-slate-950/80 border border-doc-darkBorder rounded-xl mb-3 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-cyan-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-globe text-cyan-400"></i> Пошук в мережі
                    </span>
                    <input type="checkbox" id="search-grounding" checked class="w-4 h-4 rounded bg-slate-900 border-doc-darkBorder text-cyan-400 cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-medium text-cyan-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-volume-high text-cyan-400"></i> Озвучення відповідей
                    </span>
                    <input type="checkbox" id="tts-toggle" class="w-4 h-4 rounded bg-slate-900 border-doc-darkBorder text-cyan-400 cursor-pointer">
                </div>
            </div>
        </div>

        <div class="pt-2 border-t border-doc-darkBorder/60 flex justify-between items-center text-[10px] text-gray-400 font-mono">
            <span>СИСТЕМА: <strong class="text-cyan-400">v6.0 MAX</strong></span>
            <span class="text-emerald-400"><i class="fa-solid fa-signal mr-1"></i> Онлайн</span>
        </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col h-full bg-doc-bg relative overflow-hidden min-w-0">
        <!-- Top Header Bar -->
        <header class="p-3 border-b border-doc-darkBorder bg-doc-card/80 backdrop-blur flex justify-between items-center z-10 shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <button id="open-drawer-btn" class="md:hidden p-2 text-cyan-400 hover:text-white rounded-lg bg-slate-950 border border-doc-darkBorder">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping shrink-0"></span>
                <span id="current-chat-title" class="text-xs md:text-sm font-mono text-cyan-300 font-semibold tracking-wide truncate">
                    Новий діалог
                </span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="export-chat-btn" title="Експорт" class="text-[11px] text-gray-300 hover:text-cyan-300 font-mono flex items-center gap-1 p-2 md:px-2.5 md:py-1 bg-slate-950 border border-doc-darkBorder rounded-lg">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Експорт</span>
                </button>
                <button id="clear-chat-btn" title="Очистити" class="text-[11px] text-gray-300 hover:text-red-400 font-mono flex items-center gap-1 p-2 md:px-2.5 md:py-1 bg-slate-950 border border-doc-darkBorder rounded-lg">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Очистити</span>
                </button>
            </div>
        </header>

        <!-- Messages Area -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-3 md:p-6 space-y-4 z-10">
            <!-- Messages rendered dynamically -->
        </div>

        <!-- Attachment Preview Bar -->
        <div id="file-preview-bar" class="hidden px-4 py-2 bg-slate-950 border-t border-doc-darkBorder z-10 flex items-center justify-between text-xs text-cyan-300 font-mono">
            <div class="flex items-center gap-2 truncate">
                <i class="fa-solid fa-paperclip text-cyan-400"></i>
                <span id="file-preview-name" class="truncate"></span>
            </div>
            <button id="remove-file-btn" class="text-gray-400 hover:text-red-400 p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden px-4 md:px-6 py-2 z-10">
            <div class="flex items-center gap-3 text-cyan-400 font-mono text-xs bg-slate-950/90 py-2 px-4 rounded-xl border border-doc-darkBorder w-fit shadow-manhattan">
                <i class="fa-solid fa-atom fa-spin text-sm text-cyan-300"></i>
                <span>Doctor Manhattan AI аналізує квантову структуру...</span>
            </div>
        </div>

        <!-- Input Bar -->
        <footer class="p-2 md:p-4 border-t border-doc-darkBorder bg-doc-card/90 backdrop-blur z-10 shrink-0 pb-safe">
            <form id="chat-form" class="max-w-4xl mx-auto flex gap-1.5 md:gap-2 items-end">
                <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.js,.py,.html,.css,.json,.md">
                
                <button type="button" id="attach-btn" title="Додати файл" class="p-3 bg-slate-950 hover:bg-slate-900 border border-doc-darkBorder text-cyan-400 rounded-xl flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-paperclip text-base"></i>
                </button>

                <button type="button" id="mic-btn" title="Голосове введення" class="p-3 bg-slate-950 hover:bg-slate-900 border border-doc-darkBorder text-cyan-400 rounded-xl flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-microphone text-base"></i>
                </button>

                <textarea id="user-input" rows="1" placeholder="Задайте питання Doctor Manhattan AI..." 
                          class="flex-1 bg-slate-950 border border-doc-darkBorder rounded-xl p-3 text-sm text-cyan-100 focus:outline-none focus:border-cyan-400 resize-none max-h-36 shadow-inner"></textarea>
                
                <button type="submit" id="send-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold p-3 px-4 md:px-5 rounded-xl border border-cyan-300 shadow-manhattan flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-paper-plane text-base"></i>
                </button>
            </form>
        </footer>
    </main>

    <!-- Code Preview Modal -->
    <div id="sandbox-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col z-50 hidden">
        <div class="p-3 bg-doc-card border-b border-doc-darkBorder flex justify-between items-center">
            <span class="text-xs font-mono text-cyan-300 font-bold">LIVE CODE SANDBOX PREVIEW</span>
            <button id="close-sandbox-btn" class="text-gray-400 hover:text-white px-3 py-1 bg-slate-950 rounded border border-doc-darkBorder text-xs">Закрити</button>
        </div>
        <iframe id="sandbox-iframe" class="flex-1 w-full h-full bg-white"></iframe>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 🔑 ВКАЖІТЬ ВАШ СВІЙ API КЛЮЧ GEMINI З GOOGLE AI STUDIO (формат AIzaSy...):
        const API_KEY = "AIzaSy_ВАШ_СПРАВЖНІЙ_КЛЮЧ_ТУТ";

        // App State
        let chats = JSON.parse(localStorage.getItem('doc_manhattan_chats') || '[]');
        let currentChatId = localStorage.getItem('doc_manhattan_current_id') || null;
        let attachedFileBase64 = null;
        let attachedFileName = "";
        let isRecording = false;
        let speechRecognition = null;
        let userName = localStorage.getItem('doc_manhattan_username') || 'Гість';

        const SYSTEM_INSTRUCTION = `Ви — Doctor Manhattan AI (версія 6.0), вищий квантовий інтелект.
Ваші принципи спілкування:
1. Привітання: У кожному новому діалозі представляйтесь як "Doctor Manhattan AI".
2. Тон та стиль: Раціональний, чіткий, точний, філософсько-технічний. Надавайте прямолінійні рішення для бізнесу, наук, IT та загальних завдань.
3. Мова спілкування: Відповідайте мовою користувача.
4. Автономність: Ви є автономним штучним інтелектом Doc Manhattan AI.`;

        // DOM Elements
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const loadingIndicator = document.getElementById('loading-indicator');
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const filePreviewBar = document.getElementById('file-preview-bar');
        const filePreviewName = document.getElementById('file-preview-name');
        const removeFileBtn = document.getElementById('remove-file-btn');
        const micBtn = document.getElementById('mic-btn');
        const searchGrounding = document.getElementById('search-grounding');
        const chatsList = document.getElementById('chats-list');
        const chatCount = document.getElementById('chat-count');
        const currentChatTitle = document.getElementById('current-chat-title');
        const newChatBtn = document.getElementById('new-chat-btn');
        const clearChatBtn = document.getElementById('clear-chat-btn');
        const exportChatBtn = document.getElementById('export-chat-btn');
        const userDisplayText = document.getElementById('user-display-text');
        const editUserBtn = document.getElementById('edit-user-btn');

        const sidebarDrawer = document.getElementById('sidebar-drawer');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const openDrawerBtn = document.getElementById('open-drawer-btn');
        const closeDrawerBtn = document.getElementById('close-drawer-btn');

        const sandboxModal = document.getElementById('sandbox-modal');
        const sandboxIframe = document.getElementById('sandbox-iframe');
        const closeSandboxBtn = document.getElementById('close-sandbox-btn');

        initApp();

        function initApp() {
            updateUserUI();
            setupSpeechRecognition();
            renderChatsList();

            if (!chats || chats.length === 0) {
                createNewChat();
            } else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
                    currentChatId = chats[0].id;
                }
                loadChat(currentChatId);
            }
        } // <- ТУТ БУЛА ВІДСУТНЯ ДУЖКА

        openDrawerBtn?.addEventListener('click', () => {
            sidebarDrawer.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('hidden');
        });

        const closeDrawer = () => {
            sidebarDrawer.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('hidden');
        };

        closeDrawerBtn?.addEventListener('click', closeDrawer);
        sidebarBackdrop?.addEventListener('click', closeDrawer);

        newChatBtn?.addEventListener('click', () => {
            createNewChat();
            if (window.innerWidth < 1024) closeDrawer();
        });

        clearChatBtn?.addEventListener('click', () => {
            if (confirm('Видалити поточний діалог?')) {
                chats = chats.filter(c => c.id !== currentChatId);
                saveChatsToStorage();
                if (chats.length > 0) {
                    currentChatId = chats[0].id;
                } else {
                    createNewChat();
                }
                renderChatsList();
                loadChat(currentChatId);
            }
        });

        editUserBtn?.addEventListener('click', () => {
            const newName = prompt("Введіть ваше ім'я або псевдонім:", userName);
            if (newName && newName.trim() !== "") {
                userName = newName.trim();
                localStorage.setItem('doc_manhattan_username', userName);
                updateUserUI();
            }
        });

        exportChatBtn?.addEventListener('click', () => {
            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat) return;
            
            let exportText = `# Doc Manhattan AI Chat Export\n`;
            exportText += `**Дата:** ${new Date(currentChat.timestamp).toLocaleString()}\n\n`;
            
            currentChat.messages.forEach(msg => {
                const role = msg.role === 'user' ? userName : 'Doctor Manhattan AI';
                const text = msg.parts.map(p => p.text).join('\n');
                exportText += `### ${role}:\n${text}\n\n`;
            });

            const blob = new Blob([exportText], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Manhattan_Chat_${currentChat.id}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        closeSandboxBtn?.addEventListener('click', () => {
            sandboxModal.classList.add('hidden');
            sandboxIframe.srcdoc = '';
        });

        attachBtn?.addEventListener('click', () => fileInput.click());

        fileInput?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                attachedFileBase64 = evt.target.result.split(',')[1];
                attachedFileName = file.name;
                filePreviewName.textContent = file.name;
                filePreviewBar.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        removeFileBtn?.addEventListener('click', removeAttachedFile);

        function removeAttachedFile() {
            attachedFileBase64 = null;
            attachedFileName = "";
            fileInput.value = "";
            filePreviewName.textContent = "";
            filePreviewBar.classList.add('hidden');
        }

        chatForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userInput.value.trim();
            if (!messageText && !attachedFileBase64) return;

            const currentChat = chats.find(c => c.id === currentChatId);
            if (!currentChat) return;

            const parts = [];
            if (messageText) parts.push({ text: messageText });
            if (attachedFileBase64) {
                parts.push({
                    inline_data: {
                        mime_type: "image/jpeg",
                        data: attachedFileBase64
                    }
                });
            }

            appendUserMessageDOM(messageText, attachedFileName);
            
            currentChat.messages.push({ role: 'user', parts });
            if (currentChat.messages.length === 1 || currentChat.title === "Новий розрахунок") {
                currentChat.title = messageText.slice(0, 25) || "Мультимедійний запит";
            }
            saveChatsToStorage();
            renderChatsList();

            userInput.value = '';
            userInput.style.height = 'auto';
            removeAttachedFile();

            loadingIndicator.classList.remove('hidden');
            scrollToBottom();

            try {
                const responseText = await callGeminiAPI(currentChat.messages);
                appendBotMessageDOM(responseText);
                
                currentChat.messages.push({
                    role: 'model',
                    parts: [{ text: responseText }]
                });
                saveChatsToStorage();
            } catch (error) {
                appendErrorMessageDOM(error.message || "Помилка зв'язку з квантовим ядром.");
            } finally {
                loadingIndicator.classList.add('hidden');
                scrollToBottom();
            }
        });

        async function callGeminiAPI(messages) {
            // Використовуємо правильну назву моделі Gemini
            const selectedModel = "gemini-2.5-flash-preview-09-2025";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`;

            const payload = {
                contents: messages,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                }
            };

            if (searchGrounding?.checked) {
                payload.tools = [{ google_search: {} }];
            }

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `Помилка сервера: ${response.status}`);
            }

            const data = await response.json();
            const candidate = data.candidates?.[0];
            
            if (candidate && candidate.content && candidate.content.parts) {
                return candidate.content.parts.map(p => p.text).join('');
            } else {
                throw new Error("Не отримано відповіді від квантового центру.");
            }
        }

        function createNewChat() {
            const newId = 'chat_' + Date.now();
            const newChat = {
                id: newId,
                title: 'Новий розрахунок',
                timestamp: Date.now(),
                messages: []
            };
            chats.unshift(newChat);
            currentChatId = newId;
            saveChatsToStorage();
            renderChatsList();
            loadChat(newId);
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            localStorage.setItem('doc_manhattan_current_id', chatId);
            renderChatsList();

            messagesContainer.innerHTML = '';
            const chat = chats.find(c => c.id === chatId);
            
            if (!chat || chat.messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="flex gap-3 md:gap-4 max-w-3xl">
                        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-cyan-950 border border-cyan-400 flex items-center justify-center shrink-0 text-cyan-300 shadow-manhattan">
                            <i class="fa-solid fa-atom text-sm md:text-base"></i>
                        </div>
                        <div class="bg-doc-card border border-doc-darkBorder rounded-lg p-3 md:p-4 text-xs md:text-sm text-cyan-100 shadow-manhattan">
                            <div class="font-bold text-[10px] md:text-xs text-cyan-400 mb-1 font-mono">DOCTOR MANHATTAN AI</div>
                            <div class="prose prose-invert max-w-none">
                                Вітаю, ${escapeHtml(userName)}. Я — Doctor Manhattan AI (v6.0). Мій інтелект активовано для вирішення завдань будь-якої складності: від наук та IT до бізнес-стратегій 24/7. Починаймо.
                            </div>
                        </div>
                    </div>
                `;
            } else {
                chat.messages.forEach(msg => {
                    const textPart = msg.parts.find(p => p.text)?.text || '';
                    if (msg.role === 'user') {
                        appendUserMessageDOM(textPart);
                    } else {
                        appendBotMessageDOM(textPart);
                    }
                });
            }
            scrollToBottom();
        }

        function renderChatsList() {
            if (!chatsList) return;
            chatsList.innerHTML = '';
            if (chatCount) chatCount.textContent = chats.length;

            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const btn = document.createElement('div');
                btn.className = `flex items-center justify-between p-2.5 rounded-lg border text-xs cursor-pointer transition ${
                    isActive 
                    ? 'bg-blue-950/80 border-cyan-400/80 text-cyan-200 shadow-manhattan' 
                    : 'bg-slate-900/60 border-doc-darkBorder/40 text-gray-400 hover:border-blue-700 hover:text-cyan-300'
                }`;
                btn.innerHTML = `
                    <div class="flex items-center gap-2 truncate flex-1 mr-2" onclick="loadChat('${chat.id}')">
                        <i class="fa-regular fa-message text-[10px]"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <button onclick="deleteChat(event, '${chat.id}')" class="text-gray-500 hover:text-red-400 p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                chatsList.appendChild(btn);
            });
        }

        function deleteChat(e, chatId) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== chatId);
            saveChatsToStorage();
            if (currentChatId === chatId) {
                if (chats.length > 0) {
                    currentChatId = chats[0].id;
                } else {
                    createNewChat();
                    return;
                }
            }
            renderChatsList();
            loadChat(currentChatId);
        }

        function saveChatsToStorage() {
            localStorage.setItem('doc_manhattan_chats', JSON.stringify(chats));
            localStorage.setItem('doc_manhattan_current_id', currentChatId);
        }

        function updateUserUI() {
            if (userDisplayText) userDisplayText.textContent = userName;
        }

        function appendUserMessageDOM(text, fileName = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-3 md:gap-4 max-w-3xl ml-auto justify-end';
            let fileNotice = fileName ? `<div class="text-[10px] text-cyan-400 font-mono mb-1"><i class="fa-solid fa-paperclip mr-1"></i>${escapeHtml(fileName)}</div>` : '';
            msgDiv.innerHTML = `
                <div class="bg-blue-950/70 border border-blue-700/60 rounded-lg p-3 md:p-4 text-xs md:text-sm text-cyan-50 shadow-md">
                    <div class="font-bold text-[10px] md:text-xs text-blue-300 mb-1 font-mono text-right">${escapeHtml(userName)}</div>
                    ${fileNotice}
                    <div class="whitespace-pre-wrap">${escapeHtml(text)}</div>
                </div>
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-blue-900 border border-blue-500 flex items-center justify-center shrink-0 text-cyan-200">
                    <i class="fa-solid fa-user text-xs md:text-sm"></i>
                </div>
            `;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendBotMessageDOM(markdownText) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-3 md:gap-4 max-w-3xl';
            
            const htmlContent = typeof marked !== 'undefined' ? marked.parse(markdownText || '') : markdownText;

            msgDiv.innerHTML = `
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-cyan-950 border border-cyan-400 flex items-center justify-center shrink-0 text-cyan-300 shadow-manhattan">
                    <i class="fa-solid fa-atom text-xs md:text-sm"></i>
                </div>
                <div class="bg-doc-card border border-doc-darkBorder rounded-lg p-3 md:p-4 text-xs md:text-sm text-cyan-100 shadow-manhattan overflow-hidden">
                    <div class="font-bold text-[10px] md:text-xs text-cyan-400 mb-1 font-mono">DOCTOR MANHATTAN AI</div>
                    <div class="prose prose-invert max-w-none text-cyan-100">${htmlContent}</div>
                </div>
            `;
            messagesContainer.appendChild(msgDiv);
            
            if (typeof hljs !== 'undefined') {
                msgDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                    const pre = block.parentElement;
                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'flex justify-end gap-2 mt-2';
                    btnContainer.innerHTML = `
                        <button class="bg-blue-900/60 hover:bg-cyan-600 text-[10px] text-cyan-200 px-2 py-1 rounded border border-cyan-500/30" onclick="runCodePreview(this)">
                            <i class="fa-solid fa-play mr-1"></i> Preview
                        </button>
                    `;
                    pre.appendChild(btnContainer);
                });
            }

            scrollToBottom();
        }

        function appendErrorMessageDOM(errorMsg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-3 md:gap-4 max-w-3xl';
            msgDiv.innerHTML = `
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-red-950 border border-red-500 flex items-center justify-center shrink-0 text-red-400">
                    <i class="fa-solid fa-triangle-exclamation text-xs md:text-sm"></i>
                </div>
                <div class="bg-red-950/30 border border-red-800 rounded-lg p-3 md:p-4 text-xs md:text-sm text-red-200">
                    <div class="font-bold text-[10px] md:text-xs text-red-400 mb-1 font-mono">СИСТЕМНИЙ ЗБІЙ</div>
                    <div>${escapeHtml(errorMsg)}</div>
                </div>
            `;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
        }

            const pre = btn.closest('pre');
            const code = pre.querySelector('code').innerText;
            sandboxIframe.srcdoc = code;
            sandboxModal.classList.remove('hidden');
        }
